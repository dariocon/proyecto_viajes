<header class="header" [ngClass]="{ 'wide-search': !(authService.isLogged | async), 'logged-in': (authService.isLogged | async) }">
<img src="assets/Rutalixpng (1).png" alt="Rutalix Logo" class="logo" [routerLink]="['']">

<nav class="nav-desktop">
    

    <div class="search-container" [ngClass]="{ 'wide-search': !(authService.isLogged | async) }">
        <input type="text" placeholder="Buscar viajes" class="search-input">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 19L13 13M15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8Z" stroke="#F95596" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </div>
    
    <div class="nav-item" *ngIf="(authService.isLogged | async) as session1">
            <a class="nav-link"  [routerLink]="['/mis-viajes']">Mis viajes</a>
            
    </div>
        <div class="nav-item" *ngIf="(authService.isLogged | async) as session1">
            <a class="nav-link" [routerLink]="['/create']">Crear viajes</a>
    </div>
    <a class="nav-link" [routerLink]="['/viajes']">Viajes</a>
    <a class="nav-link" [routerLink]="['/contact']">Contacto</a>

<div *ngIf="(authService.isLogged | async) as session; else showLogin" class="user-profile-container">
    <img src="assets/user-regular-full.svg" alt="Perfil" class="profile-icon" [routerLink]="['/edit-user']">
    <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
</div>

    <ng-template #showLogin>
        <button class="btn-login"  [routerLink]="['/login']">Inicia sesión</button>
        <button class="btn-register" [routerLink]="['/register']">Registro</button>
</ng-template>

</nav>

<div class="menu-mobile">
    <i class="ti ti-menu-2"></i>
</div>
</header>
